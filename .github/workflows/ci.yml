name: CI

on:
  push:
    branches: [master, 'claude/**']
    tags: ['v*']
  pull_request:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: 1
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  AVALONIA_TELEMETRY_OPTOUT: 1

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # Version in Directory.Build.props is the one version number (docs/releasing.md). A v* tag must be that version;
      # any other build is <Version>-dev.<run number>.
      - name: Work out the version
        shell: pwsh
        run: |
          $props = (Select-Xml -Path Directory.Build.props -XPath '//Version').Node.InnerText.Trim()
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            if ($env:GITHUB_REF_NAME -ne "v$props") { throw "The tag $env:GITHUB_REF_NAME is not v$props, the Version in Directory.Build.props." }
            $version = $props
          } else {
            $version = "$props-dev.$env:GITHUB_RUN_NUMBER"
          }
          Write-Host "Version $version"
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "APP_VERSION=$version"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache native dependency downloads
        uses: actions/cache@v4
        with:
          path: deps/.cache
          key: deps-${{ hashFiles('scripts/deps.json') }}

      # Windows PowerShell 5.1 is what ships with Windows, so the script must keep working there.
      - name: Fetch native dependencies (Windows PowerShell 5.1)
        shell: powershell
        run: .\scripts\fetch-deps.ps1

      - name: Verify native dependencies (PowerShell 7)
        shell: pwsh
        run: ./scripts/fetch-deps.ps1 -Check

      - name: Build
        run: dotnet build HighlightCut.slnx -c Release

      # --blame names the test that was running if a test process crashes.
      - name: Test
        run: dotnet test HighlightCut.slnx -c Release --no-build --blame

      - name: Upload UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-windows
          path: artifacts/screenshots/
          if-no-files-found: ignore

      # A ready-to-run folder with ffmpeg and libmpv: unzip and start HighlightCut.exe (no .NET install needed).
      - name: Publish the app (win-x64)
        shell: pwsh
        run: |
          dotnet publish src/HighlightCut.App -c Release -r win-x64 --self-contained -p:PublishReadyToRun=true `
            -p:Version=$env:APP_VERSION -o artifacts/HighlightCut-win-x64

      - name: Upload the app
        uses: actions/upload-artifact@v4
        with:
          name: HighlightCut-win-x64
          path: artifacts/HighlightCut-win-x64/
          if-no-files-found: error
          retention-days: 14

  # Real speech on Windows with the DirectML runtime that fetch-deps installs. The runner has no GPU, only the basic
  # display driver, which DirectML refuses: this shows that the DirectML build loads, gives the CPU build's words when
  # it falls back to the CPU, that Auto then stays on the CPU, and what the GPU check in a child process reports.
  windows-transcription:
    runs-on: windows-latest
    env:
      HIGHLIGHTCUT_MODELS_DIR: ${{ github.workspace }}\models
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache native dependency downloads
        uses: actions/cache@v4
        with:
          path: deps/.cache
          key: deps-${{ hashFiles('scripts/deps.json') }}

      # The real-model tests decode the samples with ffmpeg.
      - name: Fetch native dependencies
        shell: pwsh
        run: |
          ./scripts/fetch-deps.ps1
          Add-Content -LiteralPath $env:GITHUB_PATH -Value (Resolve-Path deps/win-x64).Path

      - name: Cache the models
        uses: actions/cache@v4
        with:
          path: models
          key: models-${{ hashFiles('src/HighlightCut.Transcription/Models/ModelCatalog.cs') }}

      - name: Build
        run: dotnet build tests/HighlightCut.Transcription.Tests -c Release

      - name: Download the models
        env:
          HIGHLIGHTCUT_NETWORK_TESTS: '1'
        run: dotnet test tests/HighlightCut.Transcription.Tests -c Release --no-build --filter "FullyQualifiedName~RealDownloadTests"

      # A skipped real-model test would mean a model or the DirectML runtime is missing.
      - name: Transcribe with the DirectML runtime
        shell: pwsh
        run: |
          dotnet test tests/HighlightCut.Transcription.Tests -c Release --no-build --filter "FullyQualifiedName~RealRecognitionTests" --logger "console;verbosity=normal" | Tee-Object -Variable log
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          if ($log -match 'Skipped ') { throw 'A real-model test was skipped.' }

      - name: Check the GPU the way the app does
        shell: pwsh
        run: |
          dotnet publish src/HighlightCut.App -c Release -r win-x64 --self-contained -o artifacts/probe
          $p = Start-Process -FilePath artifacts/probe/HighlightCut.exe -Wait -PassThru -NoNewWindow `
            -ArgumentList '--probe-gpu', 'parakeet-tdt-0.6b-v3', "`"$env:HIGHLIGHTCUT_MODELS_DIR\parakeet-tdt-0.6b-v3`"" `
            -RedirectStandardOutput probe.txt -RedirectStandardError probe-errors.txt
          Get-Content probe.txt, probe-errors.txt
          if ($p.ExitCode) { throw "--probe-gpu exited with $($p.ExitCode)" }
          # No GPU here, so the check must say why DirectML did not start, and Auto must use the CPU.
          if (-not (Select-String -Quiet -Path probe.txt -Pattern 'Works = False, .*it did not start')) { throw 'The check did not see DirectML fall back.' }
          if (-not (Select-String -Quiet -Path probe.txt -Pattern 'Auto uses: CPU')) { throw 'Auto did not choose the CPU.' }

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install ffmpeg and libmpv
        run: sudo apt-get update && sudo apt-get install -y ffmpeg libmpv2

      - name: Build
        run: dotnet build HighlightCut.slnx -c Release

      # --blame names the test that was running if a test process crashes.
      - name: Test
        run: dotnet test HighlightCut.slnx -c Release --no-build --blame

      - name: Upload UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-linux
          path: artifacts/screenshots/
          if-no-files-found: ignore

  # Tags v* become the Latest GitHub release, "V0.1.0 First Cut ✂️", with the Windows build attached and notes that
  # scripts/release-notes.py builds from CHANGELOG.md and CHANGELOG.uk.md.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            CHANGELOG.md
            CHANGELOG.uk.md
            Directory.Build.props
            scripts/release-notes.py
          sparse-checkout-cone-mode: false

      # Fails when the version has no notes or the Ukrainian notes do not match the English ones.
      - name: Build the release notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          python3 scripts/release-notes.py "$version" --output release-notes.md
          title=$(python3 scripts/release-notes.py "$version" --title)
          echo "RELEASE_TITLE=$title" >> "$GITHUB_ENV"
          cat release-notes.md

      - uses: actions/download-artifact@v4
        with:
          name: HighlightCut-win-x64
          path: HighlightCut-win-x64

      # --latest: the app release is Latest, not the older pre-releases that hold the native GPU runtime.
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          archive="HighlightCut-${GITHUB_REF_NAME#v}-windows-x64.zip"
          (cd HighlightCut-win-x64 && zip -qr9 "../$archive" .)
          gh release create "$GITHUB_REF_NAME" "$archive" --repo "$GITHUB_REPOSITORY" --latest \
            --title "$RELEASE_TITLE" --notes-file release-notes.md
