name: CI

on:
  push:
    branches: [master, 'claude/**']
    tags: ['v*']
  pull_request:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: 1
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  AVALONIA_TELEMETRY_OPTOUT: 1

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache native dependency downloads
        uses: actions/cache@v4
        with:
          path: deps/.cache
          key: deps-${{ hashFiles('scripts/deps.json') }}

      # Windows PowerShell 5.1 is what ships with Windows, so the script must keep working there.
      - name: Fetch native dependencies (Windows PowerShell 5.1)
        shell: powershell
        run: .\scripts\fetch-deps.ps1

      - name: Verify native dependencies (PowerShell 7)
        shell: pwsh
        run: ./scripts/fetch-deps.ps1 -Check

      - name: Build
        run: dotnet build OurCut.slnx -c Release

      # --blame names the test that was running if a test process crashes.
      - name: Test
        run: dotnet test OurCut.slnx -c Release --no-build --blame

      - name: Upload UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-windows
          path: artifacts/screenshots/
          if-no-files-found: ignore

      # A ready-to-run folder with ffmpeg and libmpv: unzip and start OurCut.exe (no .NET install needed).
      - name: Publish the app (win-x64)
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME.TrimStart('v') } else { '0.1.0-dev' }
          dotnet publish src/OurCut.App -c Release -r win-x64 --self-contained -p:PublishReadyToRun=true `
            -p:Version=$version -o artifacts/OurCut-win-x64

      - name: Upload the app
        uses: actions/upload-artifact@v4
        with:
          name: OurCut-win-x64
          path: artifacts/OurCut-win-x64/
          if-no-files-found: error
          retention-days: 14

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install ffmpeg and libmpv
        run: sudo apt-get update && sudo apt-get install -y ffmpeg libmpv2

      - name: Build
        run: dotnet build OurCut.slnx -c Release

      # --blame names the test that was running if a test process crashes.
      - name: Test
        run: dotnet test OurCut.slnx -c Release --no-build --blame

      - name: Upload UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-linux
          path: artifacts/screenshots/
          if-no-files-found: ignore

  # Tags v* become a GitHub release with the Windows build attached.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: OurCut-win-x64
          path: OurCut-win-x64

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          archive="OurCut-${GITHUB_REF_NAME}-win-x64.zip"
          (cd OurCut-win-x64 && zip -qr9 "../$archive" .)
          gh release create "$GITHUB_REF_NAME" "$archive" --repo "$GITHUB_REPOSITORY" \
            --title "OurCut $GITHUB_REF_NAME" --generate-notes
